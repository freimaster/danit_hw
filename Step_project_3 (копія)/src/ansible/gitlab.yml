---
- name: Install and configure GitLab
  hosts: gitlab
  become: true

  vars:
    gitlab_root_password: "your-strong_passwd20260808"
    gitlab_container_name: "gitlab"
    gitlab_internal_port: 8080

  tasks:
    - name: Create 16G swap file
      command: fallocate -l 16G /swapfile
      args:
        creates: /swapfile

    - name: Set swap permissions
      file:
        path: /swapfile
        mode: '0600'

    - name: Format swap
      command: mkswap /swapfile
      when: ansible_swaptotal_mb == 0

    - name: Enable swap
      command: swapon /swapfile
      when: ansible_swaptotal_mb == 0

    - name: Persist swap
      lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - nginx
          - curl
          - openssl
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create GitLab directory
      file:
        path: /opt/gitlab
        state: directory
        mode: '0755'

    - name: Create GitLab docker-compose.yml
      copy:
        dest: /opt/gitlab/docker-compose.yml
        mode: '0644'
        content: |
          services:
            gitlab:
              image: gitlab/gitlab-ce:latest
              container_name: gitlab
              hostname: gitlab
              restart: unless-stopped
              environment:
                GITLAB_OMNIBUS_CONFIG: |
                  external_url 'http://{{ ansible_host }}'
                  nginx['listen_port'] = 80
                  gitlab_rails['initial_root_password'] = '{{ gitlab_root_password }}'
              ports:
                - "127.0.0.1:8080:80"
              volumes:
                - gitlab-config:/etc/gitlab
                - gitlab-logs:/var/log/gitlab
                - gitlab-data:/var/opt/gitlab

          volumes:
            gitlab-config:
            gitlab-logs:
            gitlab-data:

    - name: Start GitLab
      command: docker compose up -d
      args:
        chdir: /opt/gitlab

    - name: Configure nginx reverse proxy
      copy:
        dest: /etc/nginx/sites-available/gitlab
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Disable default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Enable GitLab nginx site
      file:
        src: /etc/nginx/sites-available/gitlab
        dest: /etc/nginx/sites-enabled/gitlab
        state: link

    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes

    - name: Wait for GitLab
      uri:
        url: "http://127.0.0.1:8080/users/sign_in"
        status_code: 200
      register: gitlab_ready
      retries: 60
      delay: 10
      until: gitlab_ready.status == 200

    - name: Generate root runner API token
      shell: |
        TOKEN="glpat-$(openssl rand -hex 20)"

        docker exec gitlab gitlab-rails runner "
        user = User.find_by_username('root')

        PersonalAccessToken.where(
          user: user,
          name: 'ansible-bootstrap'
        ).destroy_all

        token = user.personal_access_tokens.create(
          name: 'ansible-bootstrap',
          scopes: ['create_runner'],
          expires_at: Date.today + 1
        )

        token.set_token('${TOKEN}')
        token.save!
        "

        echo "${TOKEN}"
      register: gitlab_api_token_result
      changed_when: true
      no_log: true

    - name: Store GitLab API token
      set_fact:
        gitlab_api_token: "{{ gitlab_api_token_result.stdout_lines[-1] }}"
        gitlab_url: "http://{{ ansible_host }}"
      no_log: true

    - name: Show GitLab URL
      debug:
        msg: "GitLab: http://{{ ansible_host }} | user: root"
