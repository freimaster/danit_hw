---
- name: Install and configure GitLab
  hosts: gitlab
  become: true

  vars:
    gitlab_root_password: "your-strong_passwd20260808"
    gitlab_container_name: "gitlab"
    gitlab_internal_port: 8080
    gitlab_registry_host: "{{ gitlab_private_ip }}:5050"

  tasks:
    - name: Render CI configuration with the current registry address
      template:
        src: "{{ playbook_dir }}/../app/.gitlab-ci.yml.j2"
        dest: "{{ playbook_dir }}/../app/.gitlab-ci.yml"
        mode: '0644'
      delegate_to: localhost
      become: false
      run_once: true

    - name: Create 16G swap file
      command: fallocate -l 16G /swapfile
      args:
        creates: /swapfile

    - name: Set swap permissions
      file:
        path: /swapfile
        mode: '0600'

    - name: Format swap
      command: mkswap /swapfile
      when: ansible_swaptotal_mb == 0

    - name: Enable swap
      command: swapon /swapfile
      when: ansible_swaptotal_mb == 0

    - name: Persist swap
      lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - nginx
          - curl
          - openssl
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create GitLab directory
      file:
        path: /opt/gitlab
        state: directory
        mode: '0755'

    - name: Create GitLab docker-compose.yml
      copy:
        dest: /opt/gitlab/docker-compose.yml
        mode: '0644'
        content: |
          services:
            gitlab:
              image: gitlab/gitlab-ce:latest
              container_name: gitlab
              hostname: gitlab
              restart: unless-stopped
              environment:
                GITLAB_OMNIBUS_CONFIG: |
                  external_url 'http://{{ ansible_host }}'
                  nginx['listen_port'] = 80
                  registry_external_url 'http://{{ gitlab_registry_host }}'
                  registry_nginx['listen_port'] = 5050
                  registry_nginx['listen_https'] = false
                  gitlab_rails['initial_root_password'] = '{{ gitlab_root_password }}'
              ports:
                - "127.0.0.1:8080:80"
                - "5050:5050"
              volumes:
                - gitlab-config:/etc/gitlab
                - gitlab-logs:/var/log/gitlab
                - gitlab-data:/var/opt/gitlab

          volumes:
            gitlab-config:
            gitlab-logs:
            gitlab-data:

    - name: Start GitLab
      command: docker compose up -d
      args:
        chdir: /opt/gitlab

    - name: Configure nginx reverse proxy
      copy:
        dest: /etc/nginx/sites-available/gitlab
        mode: '0644'
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Disable default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Enable GitLab nginx site
      file:
        src: /etc/nginx/sites-available/gitlab
        dest: /etc/nginx/sites-enabled/gitlab
        state: link

    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes

    - name: Wait for GitLab
      uri:
        url: "http://127.0.0.1:8080/users/sign_in"
        status_code: 200
      register: gitlab_ready
      retries: 60
      delay: 10
      until: gitlab_ready.status == 200

    - name: Generate root runner API token
      shell: |
        TOKEN="glpat-$(openssl rand -hex 20)"

        docker exec gitlab gitlab-rails runner "
        user = User.find_by_username('root')

        PersonalAccessToken.where(
          user: user,
          name: 'ansible-bootstrap'
        ).destroy_all

        token = user.personal_access_tokens.create(
          name: 'ansible-bootstrap',
          scopes: ['api'],
          expires_at: Date.today + 1
        )

        token.set_token('${TOKEN}')
        token.save!
        "

        echo "${TOKEN}"
      register: gitlab_api_token_result
      changed_when: true
      no_log: true

    - name: Store GitLab API token
      set_fact:
        gitlab_api_token: "{{ gitlab_api_token_result.stdout_lines[-1] }}"
        gitlab_url: "http://{{ ansible_host }}"
        gitlab_api_url: "http://127.0.0.1:8080"
      no_log: true

    - name: Check GitLab project
      uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/root%2Fstep-project-3"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: [200, 404]
      register: gitlab_project
      no_log: true
      ignore_errors: true

    - name: Report GitLab API project check failure safely
      fail:
        msg: >-
          GitLab API project check failed: status={{ gitlab_project.status | default('unavailable') }},
          message={{ gitlab_project.msg | default('no response message') }}
      when: gitlab_project is failed

    - name: Get root namespace
      uri:
        url: "{{ gitlab_api_url }}/api/v4/namespaces/root"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: 200
      register: gitlab_root_namespace
      when: gitlab_project.status == 404
      no_log: true

    - name: Create GitLab project when missing
      uri:
        url: "{{ gitlab_api_url }}/api/v4/projects"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: form-urlencoded
        body:
          name: step-project-3
          path: step-project-3
          namespace_id: "{{ gitlab_root_namespace.json.id }}"
        status_code: 201
      register: gitlab_project_created
      when: gitlab_project.status == 404
      no_log: true

    - name: Store GitLab project ID
      set_fact:
        gitlab_project_id: "{{ gitlab_project_created.json.id if gitlab_project.status == 404 else gitlab_project.json.id }}"
      no_log: true

    - name: Check REGISTRY_HOST CI variable
      uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/{{ gitlab_project_id }}/variables/REGISTRY_HOST"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: [200, 404]
      register: registry_host_variable
      no_log: true

    - name: Create REGISTRY_HOST CI variable
      uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/{{ gitlab_project_id }}/variables"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: form-urlencoded
        body:
          key: REGISTRY_HOST
          value: "{{ gitlab_registry_host }}"
        status_code: 201
      when: registry_host_variable.status == 404
      no_log: true

    - name: Update REGISTRY_HOST CI variable
      uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/{{ gitlab_project_id }}/variables/REGISTRY_HOST"
        method: PUT
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: form-urlencoded
        body:
          value: "{{ gitlab_registry_host }}"
        status_code: 200
      when: registry_host_variable.status == 200
      no_log: true

    - name: Check REGISTRY_TOKEN CI variable
      uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/{{ gitlab_project_id }}/variables/REGISTRY_TOKEN"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: [200, 404]
      register: registry_token_variable
      no_log: true

    - name: Create REGISTRY_TOKEN CI variable
      uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/{{ gitlab_project_id }}/variables"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: form-urlencoded
        body:
          key: REGISTRY_TOKEN
          value: "{{ gitlab_api_token }}"
          masked: "true"
        status_code: 201
      when: registry_token_variable.status == 404
      no_log: true

    - name: Update REGISTRY_TOKEN CI variable
      uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/{{ gitlab_project_id }}/variables/REGISTRY_TOKEN"
        method: PUT
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: form-urlencoded
        body:
          value: "{{ gitlab_api_token }}"
          masked: "true"
        status_code: 200
      when: registry_token_variable.status == 200
      no_log: true

    - name: Show GitLab URL
      debug:
        msg: "GitLab: http://{{ ansible_host }} | user: root"
