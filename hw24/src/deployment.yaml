apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-random
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-random
  template:
    metadata:
      labels:
        app: python-random
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: python-random
          image: 192.168.1.182:5050/root/hw24/python-random:1.1
          ports:
            - containerPort: 8082