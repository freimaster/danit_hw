<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

<match js_app.**>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    scheme http
    logstash_format true
    logstash_prefix nodejs
    include_timestamp true
    time_key timestamp
    suppress_type_name true
    <buffer>
      @type file
      path /fluentd/buffer/elasticsearch
      flush_interval 5s
      retry_type exponential_backoff
      retry_max_interval 30s
      retry_forever true
      total_limit_size 256m
      overflow_action block
    </buffer>
  </store>
  <store>
    @type stdout
  </store>
</match>
