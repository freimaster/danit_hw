apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: stepproject4
    name: mysql-pvc
  hostPath:
    path: /data/mysql
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: stepproject4
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  volumeName: mysql-pv
  resources:
    requests:
      storage: 2Gi
