stages:
  - build
  - deploy

variables:
  APP_IMAGE: "192.168.1.182:5050/root/stepproject4/flask-mysql"
  KUBECTL_VERSION: "v1.35.0"

.docker-job:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false", "--insecure-registry=192.168.1.182:5050"]
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    DOCKER_HOST: "tcp://localhost:2375"
    DOCKER_TLS_CERTDIR: ""
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  before_script:
    - |
      attempt=0
      until docker info >/dev/null 2>&1; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 30 ]; then
          echo "Docker-in-Docker was not ready within 60 seconds." >&2
          exit 1
        fi
        sleep 2
      done

build:
  extends: .docker-job
  stage: build
  script:
    - printf '%s' "$REGISTRY_PASSWORD" | docker login 192.168.1.182:5050 --username "$REGISTRY_USER" --password-stdin
    - docker buildx build --provenance=false --sbom=false --load -t "$APP_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$APP_IMAGE:latest" forStep4
    - sh test.sh "$APP_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$APP_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push "$APP_IMAGE:latest"
      fi

deploy:
  stage: deploy
  image: alpine:3.22
  resource_group: stepproject4
  variables:
    KUBERNETES_SERVICE_ACCOUNT_OVERWRITE: "gitlab-deployer"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache curl ca-certificates
    - |
      case "$(uname -m)" in
        x86_64) arch=amd64 ;;
        aarch64) arch=arm64 ;;
        *) echo "Unsupported architecture"; exit 1 ;;
      esac
      url="https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/$arch/kubectl"
      curl -fsSLo /tmp/kubectl "$url"
      curl -fsSLo /tmp/kubectl.sha256 "$url.sha256"
      printf '%s  /tmp/kubectl\n' "$(cat /tmp/kubectl.sha256)" | sha256sum -c -
      install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    - kubectl -n stepproject4 get secret gitlab-registry
  script:
    - kubectl apply -f k8s/storage.yaml
    - kubectl apply -f k8s/mysql.yaml
    - kubectl -n stepproject4 rollout status deployment/mysql --timeout=300s
    - kubectl set image --local -f k8s/app-deployment.yaml flask-app="$APP_IMAGE:$CI_COMMIT_SHORT_SHA" -o yaml > /tmp/flask-deployment.yaml
    - kubectl apply -f /tmp/flask-deployment.yaml
    - kubectl apply -f k8s/app-service.yaml
    - kubectl -n stepproject4 rollout status deployment/flask-app --timeout=120s
    - kubectl -n stepproject4 get pods -o wide
