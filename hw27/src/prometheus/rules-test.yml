rule_files:
- alerts.yml
evaluation_interval: 15s
tests:
- name: all three alerts firing
  interval: 1m
  input_series:
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 14+0x10
  - series: node_filesystem_size_bytes{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 100+0x10
  - series: node_filesystem_readonly{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 0+0x10
  - series: node_cpu_seconds_total{job="node-exporter",instance="vm",cpu="0",mode="idle"}
    values: 0+6x10
  - series: up{job="cadvisor",instance="cadvisor:8080"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: HostDiskSpaceLow
    exp_alerts:
    - exp_labels:
        severity: warning
        job: node-exporter
        instance: vm
        device: /dev/test
        mountpoint: /mnt/test
        fstype: ext4
      exp_annotations:
        summary: Free disk space below 15%
        description: 'vm /mnt/test: 14.0% available.'
  - eval_time: 5m
    alertname: HostCpuHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        instance: vm
      exp_annotations:
        summary: Host CPU usage above 80%
        description: 'vm: 90.0% busy, averaged across all CPUs.'
  - eval_time: 5m
    alertname: TargetDown
    exp_alerts:
    - exp_labels:
        severity: critical
        job: cadvisor
        instance: cadvisor:8080
      exp_annotations:
        summary: Prometheus target unavailable
        description: cadvisor / cadvisor:8080 cannot be scraped.
- name: 15 percent free is not below threshold and healthy targets
  interval: 1m
  input_series:
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 15+0x10
  - series: node_filesystem_size_bytes{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 100+0x10
  - series: node_filesystem_readonly{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 0+0x10
  - series: node_cpu_seconds_total{job="node-exporter",instance="vm",cpu="0",mode="idle"}
    values: 0+30x10
  - series: up{job="cadvisor",instance="cadvisor:8080"}
    values: 1+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: HostDiskSpaceLow
    exp_alerts: []
  - eval_time: 5m
    alertname: HostCpuHigh
    exp_alerts: []
  - eval_time: 5m
    alertname: TargetDown
    exp_alerts: []
- name: CPU exactly 80 percent must not fire
  interval: 1m
  input_series:
  - series: node_filesystem_avail_bytes{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 15+0x10
  - series: node_filesystem_size_bytes{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 100+0x10
  - series: node_filesystem_readonly{job="node-exporter",instance="vm",device="/dev/test",mountpoint="/mnt/test",fstype="ext4"}
    values: 0+0x10
  - series: node_cpu_seconds_total{job="node-exporter",instance="vm",cpu="0",mode="idle"}
    values: 0+12x10
  - series: up{job="cadvisor",instance="cadvisor:8080"}
    values: 1+0x10
  alert_rule_test:
  - eval_time: 5m
    alertname: HostDiskSpaceLow
    exp_alerts: []
  - eval_time: 5m
    alertname: HostCpuHigh
    exp_alerts: []
  - eval_time: 5m
    alertname: TargetDown
    exp_alerts: []
