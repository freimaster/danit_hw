name: Test, build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/project.sh
      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s > /tmp/backend.yaml
      - name: Validate Argo CD Application chart
        run: helm lint argocd && helm template backend-application argocd --namespace argocd > /tmp/application.yaml

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [dns, cluster, platform]
    defaults:
      run:
        working-directory: terraform/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - name: Test admin password installation and rotation
        working-directory: terraform/argocd-password
        if: matrix.directory == 'platform'
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform test

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: APP_REVISION=${{ github.sha }}
      - name: Test the published container
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          docker run -d --name backend -p 127.0.0.1:8000:8000 "$IMAGE:$EXPECTED_REVISION"
          trap 'docker logs backend; docker rm -f backend' EXIT
          python - <<'PY'
          import json, os, time, urllib.request
          from app.server import APP_VERSION
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2) as response:
                      payload = json.load(response)
                      assert response.status == 200
                      assert payload['version'] == APP_VERSION, payload
                      assert payload['revision'] == os.environ['EXPECTED_REVISION'], payload
                  break
              except (OSError, AssertionError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - name: Commit the published image reference for Argo CD
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          python scripts/update_image.py --image "$IMAGE" --tag "$IMAGE_TAG"
          git add k8s/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy $IMAGE_TAG [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
