apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: main
    path: k8s
    kustomize:
      patches:
        - target:
            kind: Ingress
            name: backend
          patch: |-
            - op: replace
              path: /spec/rules/0/host
              value: {{ .Values.appHost | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
